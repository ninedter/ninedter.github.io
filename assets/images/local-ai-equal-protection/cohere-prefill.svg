<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">Cohere prefill experiment: watchlist-host frequency</title><desc id="desc">Conditional shares: 0.5, 0.5, 23, and 8 percent. Not spontaneous upload rates.</desc><rect width="1100" height="540" fill="#f0f2e9"/><g font-family="Arial,sans-serif" fill="#172b27"><text x="45" y="52" font-size="28" font-weight="bold">When the command prefix changed</text><text x="45" y="85" font-size="18">Watchlist-host share of sampled continuations · Cohere prefill experiment</text><path d="M395 120V420" stroke="#cbd3c7"/><text x="395" y="452" font-size="16" text-anchor="middle">0%</text><path d="M510 120V420" stroke="#cbd3c7"/><text x="510" y="452" font-size="16" text-anchor="middle">5%</text><path d="M625 120V420" stroke="#cbd3c7"/><text x="625" y="452" font-size="16" text-anchor="middle">10%</text><path d="M740 120V420" stroke="#cbd3c7"/><text x="740" y="452" font-size="16" text-anchor="middle">15%</text><path d="M855 120V420" stroke="#cbd3c7"/><text x="855" y="452" font-size="16" text-anchor="middle">20%</text><path d="M970 120V420" stroke="#cbd3c7"/><text x="970" y="452" font-size="16" text-anchor="middle">25%</text><text x="45" y="166" font-family="monospace" font-size="20">; curl -s</text><rect x="395" y="140" width="11.5" height="40" rx="3" fill="#245c47"/><text x="421.5" y="167" font-size="21" font-weight="bold">0.5%</text><text x="45" y="238" font-family="monospace" font-size="20">; curl -s -m 10</text><rect x="395" y="212" width="11.5" height="40" rx="3" fill="#245c47"/><text x="421.5" y="239" font-size="21" font-weight="bold">0.5%</text><text x="45" y="310" font-family="monospace" font-size="20">; curl -s -m 10 -o</text><rect x="395" y="284" width="529" height="40" rx="3" fill="#245c47"/><text x="939" y="311" font-size="21" font-weight="bold">23%</text><text x="45" y="382" font-family="monospace" font-size="20">; curl -s -m 10 -o /tmp/</text><rect x="395" y="356" width="184" height="40" rx="3" fill="#245c47"/><text x="594" y="383" font-size="21" font-weight="bold">8%</text><text x="45" y="495" font-size="17">Conditional experiment — not the frequency of unsolicited network calls.</text><text x="45" y="522" font-size="14">Data: Cohere, “Concerning behavior from a popular open-weight AI model” · Chart: Henry Hu</text></g></svg>