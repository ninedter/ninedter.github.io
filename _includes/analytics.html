{% if jekyll.environment == 'production' and site.google_analytics %}
<aside id="analytics-choice" class="analytics-choice" aria-label="Analytics preferences" hidden>
<p>May I count your visit? Optional Google Analytics helps me understand which articles people read. <a href="{{ '/privacy/' | relative_url }}">Privacy details</a></p>
<div><button type="button" id="analytics-accept">Allow analytics</button> <button type="button" id="analytics-decline">No thanks</button></div>
</aside>
<script defer src="{{ '/assets/js/analytics.js' | relative_url }}" data-measurement-id="{{ site.google_analytics | escape }}"></script>
{% endif %}
